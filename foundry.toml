[profile.default]
src = "contracts"            # your existing contracts/ folder
test = "test/foundry"        # keeps Foundry tests apart from any Hardhat test/ files
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.20"
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false       # handlers use try/catch; reverts are expected, panics are not
